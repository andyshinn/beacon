name: Homebrew cask

# Keep Casks/beacon.rb (version + sha256) in sync with releases. Fires only for
# STABLE, published releases — `released` excludes drafts and prereleases — so the
# download URL resolves and the sha256 matches the final published bytes.
on:
  release:
    types: [released]

permissions:
  contents: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # commit the bump onto the branch head, not the tagged commit

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download release DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Beacon-*-universal.dmg' --dir dist

      - name: Update cask
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          dmgs=(dist/Beacon-*-universal.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then echo "No universal DMG found in release $TAG"; exit 1; fi
          node scripts/update-cask.mjs --version "${TAG#v}" --dmg "${dmgs[0]}"

      - name: Commit cask bump
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- Casks/beacon.rb; then
            echo "Cask already up to date for $TAG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/beacon.rb
          git commit -m "chore: bump homebrew cask to ${TAG} [skip ci]"
          git push origin HEAD:main
